services:

  # ── Full pipeline: simulator + collection + webserver bridge ─────────────
  runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ros2-il-pipeline:humble
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - ../ros2_ws/src:/ros2_ws/src:ro
      - ../data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -c "ros2 launch il_pipeline_bringup full_pipeline.launch.py"

  # ── Inference ─────────────────────────────────────────────────────────────
  inference:
    image: ros2-il-pipeline:humble
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - ../ros2_ws/src:/ros2_ws/src:ro
      - ../data:/data
      - ../training:/workspace/training:ro
    command: >
      bash -c "ros2 launch il_pipeline_bringup inference.launch.py
        checkpoint:=/data/models/best.pt
        algorithm:=bc
        training_src_dir:=/workspace/training"
    profiles: [inference]

  # ── Training (CPU — default) ───────────────────────────────────────────────
  training:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    image: ros2-il-pipeline:training
    volumes:
      - ../data:/workspace/data
      - ../training:/workspace/training
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
    command: python training/train_bc.py --config /workspace/training/configs/bc_config.yaml --episodes_dir /workspace/data/episodes
    profiles: [training]

  # ── Training (GPU — activate with: docker compose --profile training-gpu up)
  training-gpu:
    extends: training
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: [training-gpu]
