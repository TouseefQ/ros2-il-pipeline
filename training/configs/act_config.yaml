algorithm: act

data:
  episodes_dir: "../data/episodes"
  val_split: 0.1
  record_images: false
  image_size: [128, 128]
  normalize_joints: true
  chunk_size: 10               # T_pred: steps predicted per forward pass

model:
  # CVAE encoder
  latent_dim: 32
  encoder_hidden_dim: 256
  # Transformer decoder
  d_model: 256
  nhead: 8
  num_encoder_layers: 4
  num_decoder_layers: 7
  dim_feedforward: 2048
  dropout: 0.1
  # Inputs
  joint_input_dim: 7           # num_joints
  eef_input_dim: 7             # pos + quat
  output_dim: 7                # joint_pos_abs per step in chunk
  use_images: false            # set true to enable vision backbone

training:
  epochs: 200
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  kl_weight: 10.0              # β for KL divergence term
  grad_clip: 1.0
  checkpoint_dir: "../data/models"
  log_every_n_steps: 50
  save_every_n_epochs: 10
