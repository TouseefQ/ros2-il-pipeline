algorithm: bc

data:
  episodes_dir: "../data/episodes"
  val_split: 0.1
  record_images: false
  image_size: [128, 128]
  normalize_joints: true        # scale joint_pos to [-1, 1]

model:
  type: mlp                     # "mlp" | "cnn_mlp"
  joint_input_dim: 7            # num_joints × 2  (pos + vel)
  eef_input_dim: 7              # 3 (pos) + 4 (quat)
  hidden_dims: [256, 256, 256]
  output_dim: 7                 # joint_pos_delta
  dropout: 0.1

training:
  epochs: 100
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-5
  grad_clip: 1.0
  checkpoint_dir: "../data/models"
  log_every_n_steps: 50
  save_every_n_epochs: 10
